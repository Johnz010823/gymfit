{% load socialaccount %}
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign In with Google - GymFit Pro</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top, #1a1a1a, #0d0d0d);
            color: white;
        }

        .auth-card {
            width: 420px;
            padding: 40px;
            border-radius: 18px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            backdrop-filter: blur(20px);
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            color: #e63946;
            margin-bottom: 10px;
        }

        h2 {
            margin: 10px 0;
            font-size: 22px;
        }

        p {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 12px;

            background: #ffffff;
            color: #000;
            font-weight: 600;
            font-size: 15px;

            cursor: pointer;
            transition: 0.25s ease;
        }

        .google-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255,255,255,0.15);
        }

        .google-btn img {
            width: 18px;
        }

        .footer {
            margin-top: 18px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>

<body>

<div class="auth-card">

    <div class="logo">GymFit Pro</div>

    <h2>Sign in with Google</h2>
    <p>Secure login using your Google account</p>

    <!-- PROPER ALLAUTH GOOGLE LOGIN -->
    <form method="post">
        {% csrf_token %}

        <button type="submit" class="google-btn">
            <img src="https://developers.google.com/identity/images/g-logo.png">
            Continue with Google
        </button>
    </form>

    <div class="footer">
        By continuing, you agree to our Terms & Privacy Policy
    </div>

</div>

</body>
</html>
