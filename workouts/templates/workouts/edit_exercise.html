{% extends 'base.html' %}
{% block title %}Edit Exercise{% endblock %}
{% block content %}
<div class="container py-4" style="max-width:600px;">
  <h4 class="mb-3">✏️ Edit Exercise</h4>

  <form method="post">
    {% csrf_token %}

    <!-- ── Exercise picker (grouped by category / subcategory) ── -->
    <div class="mb-3">
      <label class="form-label fw-bold">Exercise Name</label>
      <select name="name" class="form-select" required>
        <option value="">— Select an exercise —</option>
        {% for cat_name, cat_data in exercise_library.items %}
          <optgroup label="{{ cat_data.icon }} {{ cat_name }}">
            {% for subcat, ex_list in cat_data.subcategories.items %}
              {% for ex_name in ex_list %}
                <option value="{{ ex_name }}"
                  {% if ex_name == exercise.name %}selected{% endif %}>
                  {{ ex_name }}
                </option>
              {% endfor %}
            {% endfor %}
          </optgroup>
        {% endfor %}
      </select>
    </div>

    <!-- ── Sets / Reps / Weight ── -->
    <div class="row g-3 mb-4">
      <div class="col-4">
        <label class="form-label">Sets</label>
        <input type="number" name="sets" class="form-control"
               value="{{ exercise.sets }}" min="1" max="20" required>
      </div>
      <div class="col-4">
        <label class="form-label">Reps</label>
        <input type="number" name="reps" class="form-control"
               value="{{ exercise.reps }}" min="1" max="200" required>
      </div>
      <div class="col-4">
        <label class="form-label">Weight (kg)</label>
        <input type="number" name="weight" class="form-control"
               value="{{ exercise.weight_kg|default_if_none:'' }}"
               min="0" step="0.5" placeholder="opt.">
      </div>
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-warning fw-bold">Save Changes</button>
      <a href="{% url 'workout_plan' %}" class="btn btn-outline-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
