{% extends 'base.html' %}
{% load static %}

{% block title %}Add Exercise — {{ day }}{% endblock %}

{% block extra_css %}
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap');

  :root {
    --bg: #0a0a0c; --card: #111114; --border: #1e1e24;
    --accent: #c8ff00; --text: #eeeef0; --muted: #555560;
    --red: #ff3b55; --green: #00e676;
  }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; }

  .form-wrap {
    max-width: 520px; margin: 3rem auto; padding: 0 1rem;
  }
  .form-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; letter-spacing: .5px; margin-bottom: .3rem; }
  .form-title em { color: var(--accent); font-style: normal; }
  .form-sub { color: var(--muted); font-size: .85rem; margin-bottom: 1.8rem; }

  .form-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 1.6rem;
  }

  .field { margin-bottom: 1.2rem; }
  .field label { display: block; font-size: .8rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: .45rem; }
  .field select,
  .field input {
    width: 100%; background: #0a0a0c; border: 1px solid var(--border);
    color: var(--text); border-radius: 8px;
    padding: .6rem .85rem; font-family: 'DM Sans', sans-serif; font-size: .9rem;
    outline: none; transition: border-color .2s;
  }
  .field select:focus, .field input:focus { border-color: var(--accent); }
  .field select option { background: #111114; }

  .fields-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .85rem; }

  .btn-submit {
    width: 100%; background: var(--accent); color: #0a0a0c;
    border: none; padding: .7rem; border-radius: 9px;
    font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: .95rem;
    cursor: pointer; transition: transform .15s, box-shadow .15s;
    margin-top: .4rem;
  }
  .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(200,255,0,.25); }

  .back-link { display: inline-flex; align-items: center; gap: .3rem; color: var(--muted); text-decoration: none; font-size: .83rem; margin-top: 1rem; }
  .back-link:hover { color: var(--text); }
</style>
{% endblock %}

{% block content %}
<div class="form-wrap">
  <div class="form-title">Add <em>Exercise</em></div>
  <div class="form-sub">Manually add an exercise to <strong style="color:var(--text)">{{ day }}</strong></div>

  <div class="form-card">
    <form method="post">
      {% csrf_token %}

      <div class="field">
        <label>Exercise Name</label>
        <select name="name" required>
          <option value="">— Select an exercise —</option>
          {% for cat_name, cat_data in exercise_library.items %}
            <optgroup label="{{ cat_data.icon }} {{ cat_name }}">
              {% for subcat, ex_list in cat_data.subcategories.items %}
                {% for ex_name in ex_list %}
                  <option value="{{ ex_name }}">{{ ex_name }}</option>
                {% endfor %}
              {% endfor %}
            </optgroup>
          {% endfor %}
        </select>
      </div>

      <div class="fields-row">
        <div class="field">
          <label>Sets</label>
          <input type="number" name="sets" value="3" min="1" max="20" required>
        </div>
        <div class="field">
          <label>Reps</label>
          <input type="number" name="reps" value="10" min="1" max="200" required>
        </div>
        <div class="field">
          <label>Weight (kg)</label>
          <input type="number" name="weight" min="0" step="0.5" placeholder="—">
        </div>
      </div>

      <button type="submit" class="btn-submit">＋ Add to {{ day }}</button>
    </form>
  </div>

  <a href="{% url 'workout_plan' %}" class="back-link">← Back to Plan</a>
</div>
{% endblock %}
