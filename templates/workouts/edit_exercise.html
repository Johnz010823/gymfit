{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

<h2>Edit Exercise</h2>

<form method="POST">

{% csrf_token %}

<div class="form-group">

<label>Name</label>

<input
type="text"
name="name"
value="{{ exercise.name }}"
class="form-control"
required>

</div>

<div class="form-group">

<label>Sets</label>

<input
type="number"
name="sets"
value="{{ exercise.sets }}"
class="form-control"
required>

</div>

<div class="form-group">

<label>Reps</label>

<input
type="number"
name="reps"
value="{{ exercise.reps }}"
class="form-control"
required>

</div>

<div class="form-group">

<label>Weight (kg)</label>

<input
type="number"
name="weight"
value="{{ exercise.weight_kg }}"
class="form-control">

</div>

<button
type="submit"
class="btn btn-primary mt-3">

Save Changes

</button>

<a href="{% url 'workout_plan' %}"
class="btn btn-secondary mt-3">

Cancel

</a>

</form>

</div>

{% endblock %}
