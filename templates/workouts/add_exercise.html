{% extends 'base.html' %}

{% block content %}

<h2>Add Exercise — {{ day }}</h2>

<form method="POST">

{% csrf_token %}

<label>Name</label>
<input type="text" name="name" required>

<label>Sets</label>
<input type="number" name="sets" required>

<label>Reps</label>
<input type="number" name="reps" required>

<label>Weight (kg)</label>
<input type="number" name="weight">

<button type="submit">

Add Exercise

</button>

</form>

{% endblock %}
