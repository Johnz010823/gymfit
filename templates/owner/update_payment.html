{% extends 'base.html' %}
{% block title %}Update Payment - GymFit Pro{% endblock %}

{% block content %}
<div class="page-header">
    <a href="{% url 'owner_dashboard' %}" class="btn-back-page"><i class="fas fa-arrow-left"></i> Back</a>
    <h1 class="page-title">Update Payment — {{ member.get_full_name|default:member.username }}</h1>
</div>

<div class="dash-card" style="max-width:560px">
    <form method="POST" class="profile-form">
        {% csrf_token %}
        <div class="form-group">
            <label>Payment Status</label>
            <select name="status" class="form-control">
                <option value="paid" {% if payment and payment.status == 'paid' %}selected{% endif %}>Paid</option>
                <option value="unpaid" {% if not payment or payment.status == 'unpaid' %}selected{% endif %}>Unpaid</option>
                <option value="overdue" {% if payment and payment.status == 'overdue' %}selected{% endif %}>Overdue</option>
            </select>
        </div>
        <div class="form-group">
            <label>Membership Plan</label>
            <select name="plan" class="form-control">
                <option value="monthly" {% if not payment or payment.plan == 'monthly' %}selected{% endif %}>Monthly — ₱500</option>
                <option value="quarterly" {% if payment and payment.plan == 'quarterly' %}selected{% endif %}>Quarterly — ₱1,400</option>
                <option value="annual" {% if payment and payment.plan == 'annual' %}selected{% endif %}>Annual — ₱5,000</option>
            </select>
        </div>
        <div class="form-group">
            <label>Payment Date</label>
            <input type="date" name="payment_date" class="form-control"
                   value="{% if payment and payment.payment_date %}{{ payment.payment_date|date:'Y-m-d' }}{% endif %}">
        </div>
        <div class="form-group">
            <label>Expiry Date</label>
            <input type="date" name="expiry_date" class="form-control"
                   value="{% if payment and payment.expiry_date %}{{ payment.expiry_date|date:'Y-m-d' }}{% endif %}">
        </div>
        <button type="submit" class="btn-face btn-start" style="width:100%">
            <i class="fas fa-save"></i> Save Payment
        </button>
    </form>
</div>
{% endblock %}
