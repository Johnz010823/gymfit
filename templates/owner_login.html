{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Login - GymFit Pro</title>

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top, #1a1a1a, #0d0d0d);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        /* ── CARD ── */
        .auth-card {
            width: 420px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }

        /* ── BRAND ── */
        .auth-brand {
            font-size: 26px;
            font-weight: 700;
            color: #e63946;
            font-family: 'Bebas Neue', sans-serif;
            margin-bottom: 10px;
        }

        .auth-sub {
            color: #aaa;
            margin-bottom: 25px;
        }

        /* ── ERROR ── */
        .error-text {
            color: #ff4d6d;
            font-size: 13px;
            margin-bottom: 10px;
            padding: 10px;
            background: rgba(255, 77, 109, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(255, 77, 109, 0.3);
        }

        /* ── FORM ── */
        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }

        label {
            font-size: 12px;
            color: #bbb;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border-radius: 10px;
            border: 1px solid #333;
            background: #111;
            color: white;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #e63946;
        }

        /* ── SUBMIT BUTTON ── */
        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #e63946, #ff4d6d);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .btn-login:hover {
            transform: scale(1.03);
        }

        /* ── BACK LINK ── */
        .back-link {
            margin-top: 15px;
            font-size: 13px;
        }

        .back-link a {
            color: #aaa;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link a:hover {
            color: white;
        }
    </style>
</head>
<body>

<div class="auth-card">

    <!-- Brand -->
    <div class="auth-brand">
        <i class="fas fa-user-shield"></i> Owner Login
    </div>

    <h2>Admin Access</h2>
    <p class="auth-sub">Authorized personnel only</p>

    <!-- Error Message -->
    {% if error %}
        <p class="error-text">
            <i class="fas fa-exclamation-circle"></i> {{ error }}
        </p>
    {% endif %}

    <!-- Owner Login Form -->
    <form method="POST" action="{% url 'owner_login' %}">
        {% csrf_token %}

        <div class="form-group">
            <label for="login">Email</label>
            <input type="text" id="login" name="login" placeholder="Enter owner email" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter password" required>
        </div>

        <button class="btn-login" type="submit">
            <i class="fas fa-sign-in-alt"></i> Login as Owner
        </button>
    </form>

    <!-- Back Link -->
    <div class="back-link">
        <a href="{% url 'account_login' %}">← Back to Member Login</a>
    </div>

</div>

</body>
</html>
