{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set New Password - GymFit Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
    font-family:'Inter',sans-serif;
    background: radial-gradient(ellipse at top left,#1f0a0a,#0d0d0d 60%),
                radial-gradient(ellipse at bottom right,#1a0608,#0d0d0d);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
}

/* ORBS */
.orb {
    position:fixed;
    border-radius:50%;
    filter:blur(80px);
    opacity:.12;
}
.orb-1 { width:400px;height:400px;background:#e63946;top:-100px;left:-100px; }
.orb-2 { width:300px;height:300px;background:#ff4d6d;bottom:-80px;right:-80px; }

/* CARD */
.card {
    width:420px;
    padding:50px 40px;
    border-radius:26px;
    background:rgba(255,255,255,0.04);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.06);
    box-shadow:0 25px 60px rgba(0,0,0,.7);
    text-align:center;
}

/* TITLE */
.brand {
    font-family:'Bebas Neue',sans-serif;
    color:#e63946;
    letter-spacing:1px;
    margin-bottom:10px;
}

.title {
    font-size:22px;
    font-weight:700;
    margin-bottom:6px;
}

.sub {
    font-size:13px;
    color:#777;
    margin-bottom:28px;
}

/* INPUTS */
.input-group {
    margin-bottom:18px;
    text-align:left;
}

.input-group label {
    font-size:13px;
    color:#aaa;
    display:block;
    margin-bottom:6px;
}

.input-group input {
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.08);
    background:rgba(255,255,255,0.03);
    color:white;
    outline:none;
    transition:.2s;
}

.input-group input:focus {
    border-color:#e63946;
    box-shadow:0 0 0 2px rgba(230,57,70,0.2);
}

/* BUTTON */
.btn {
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:linear-gradient(90deg,#e63946,#ff4d6d);
    color:white;
    font-weight:700;
    cursor:pointer;
    margin-top:10px;
    box-shadow:0 6px 20px rgba(230,57,70,0.4);
}

.btn:hover {
    transform:translateY(-2px);
}

/* ERRORS */
.errorlist {
    list-style:none;
    font-size:12px;
    color:#ff6b6b;
    margin-bottom:8px;
}

/* BACK LINK */
.back {
    display:block;
    margin-top:18px;
    font-size:13px;
    color:#777;
    text-decoration:none;
}
.back:hover { color:#e63946; }

</style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="card">

    <div class="brand"><i class="fas fa-dumbbell"></i> GymFit Pro</div>

    <div class="title">Set New Password</div>
    <div class="sub">Create a strong password to secure your account</div>

    <form method="POST">
        {% csrf_token %}

        {{ form.non_field_errors }}

        <div class="input-group">
            <label>New Password</label>
            {{ form.password1 }}
            {{ form.password1.errors }}
        </div>

        <div class="input-group">
            <label>Confirm Password</label>
            {{ form.password2 }}
            {{ form.password2.errors }}
        </div>

        <button type="submit" class="btn">
            <i class="fas fa-key"></i> Change Password
        </button>
    </form>

    <a href="{% url 'account_login' %}" class="back">
        ← Back to Sign In
    </a>

</div>

</body>
</html>
